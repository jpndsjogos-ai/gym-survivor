name: Build Android APK (Gym Survivor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Gerar APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Dummy Icon and Complete Structure
        run: |
          mkdir -p scenes/ui scenes/main scripts/autoload scripts/ui

          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" fill="#478cbf"/></svg>
          EOF

          cat << 'EOF' > scripts/autoload/save_system.gd
          class_name SaveSystem
          extends Node
          const SAVE_PATH: String = "user://save_data.cfg"
          var high_score_time: float = 0.0
          func _ready() -> void: load_game()
          func save_game() -> void:
          	var config = ConfigFile.new()
          	config.set_value("stats", "high_score_time", high_score_time)
          	config.save(SAVE_PATH)
          func load_game() -> void:
          	var config = ConfigFile.new()
          	if config.load(SAVE_PATH) == OK:
          		high_score_time = config.get_value("stats", "high_score_time", 0.0)
          EOF

          cat << 'EOF' > scenes/ui/main_menu.tscn
          [gd_scene load_steps=2 format=3 uid="uid://mainmenu123"]
          [ext_resource type="Script" path="res://scripts/ui/main_menu.gd" id="1_menu"]
          [node name="MainMenu" type="Control"]
          layout_mode = 3
          anchors_preset = 15
          anchor_right = 1.0
          anchor_bottom = 1.0
          grow_horizontal = 2
          grow_vertical = 2
          script = ExtResource("1_menu")
          [node name="VBoxContainer" type="VBoxContainer" parent="."]
          layout_mode = 1
          anchors_preset = 8
          anchor_left = 0.5
          anchor_top = 0.5
          anchor_right = 0.5
          anchor_bottom = 0.5
          offset_left = -200.0
          offset_top = -100.0
          offset_right = 200.0
          offset_bottom = 100.0
          grow_horizontal = 2
          grow_vertical = 2
          [node name="TitleLabel" type="Label" parent="VBoxContainer"]
          layout_mode = 2
          text = "GYM SURVIVOR"
          horizontal_alignment = 1
          [node name="PlayButton" type="Button" parent="VBoxContainer"]
          custom_minimum_size = Vector2(0, 80)
          layout_mode = 2
          text = "JOGAR"
          EOF

          cat << 'EOF' > scripts/ui/main_menu.gd
          class_name MainMenu
          extends Control
          @onready var play_button: Button = $VBoxContainer/PlayButton
          func _ready() -> void:
          	play_button.pressed.connect(_on_play_pressed)
          func _on_play_pressed() -> void:
          	get_tree().quit()
          EOF

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=BR" -validity 10000
          mkdir -p ~/.android
          mv debug.keystore ~/.android/debug.keystore

      - name: Export Godot Android APK
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_version: 4.2.1
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-survivor-apk
          path: build/Android/gym-survivor.apk
