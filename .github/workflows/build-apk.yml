name: Build Android APK (Gym Survivor)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  export-android:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot Engine
        uses: chickenandpork/setup-godot@v2
        with:
          version: '4.2.1'
          use-dotnet: false

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=BR" -validity 10000
          mv debug.keystore ~/.android/debug.keystore

      - name: Download Godot Export Templates
        run: |
          GODOT_VERSION="4.2.1.stable"
          mkdir -p ~/.local/share/godot/build_templates/4.2.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/build_templates/4.2.1.stable/
          rm Godot_v${GODOT_VERSION}_export_templates.tpz

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/gym-survivor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-survivor-apk
          path: build/gym-survivor.apk
