name: Build Android APK (Gym Survivor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Gerar APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      - name: Download and Install Godot 4.2.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip Godot_v4.2.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Download Godot Export Templates
        run: |
          GODOT_VERSION="4.2.1.stable"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATES_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip -q Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* "$TEMPLATES_DIR/"
          rm Godot_v4.2.1-stable_export_templates.tpz

      - name: Generate Dummy Icon, Structure and Export Preset
        run: |
          mkdir -p scenes/ui scenes/main scripts/autoload scripts/ui

          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" fill="#478cbf"/></svg>
          EOF

          cat << 'EOF' > scripts/autoload/save_system.gd
          class_name SaveSystem
          extends Node
          const SAVE_PATH: String = "user://save_data.cfg"
          var high_score_time: float = 0.0
          func _ready() -> void: load_game()
          func save_game() -> void:
          	var config = ConfigFile.new()
          	config.set_value("stats", "high_score_time", high_score_time)
          	config.save(SAVE_PATH)
          func load_game() -> void:
          	var config = ConfigFile.new()
          	if config.load(SAVE_PATH) == OK:
          		high_score_time = config.get_value("stats", "high_score_time", 0.0)
          EOF

          cat << 'EOF' > scenes/ui/main_menu.tscn
          [gd_scene load_steps=2 format=3 uid="uid://mainmenu123"]
          [ext_resource type="Script" path="res://scripts/ui/main_menu.gd" id="1_menu"]
          [node name="MainMenu" type="Control"]
          layout_mode = 3
          anchors_preset = 15
          anchor_right = 1.0
          anchor_bottom = 1.0
          grow_horizontal = 2
          grow_vertical = 2
          script = ExtResource("1_menu")
          [node name="VBoxContainer" type="VBoxContainer" parent="."]
          layout_mode = 1
          anchors_preset = 8
          anchor_left = 0.5
          anchor_top = 0.5
          anchor_right = 0.5
          anchor_bottom = 0.5
          offset_left = -200.0
          offset_top = -100.0
          offset_right = 200.0
          offset_bottom = 100.0
          grow_horizontal = 2
          grow_vertical = 2
          [node name="TitleLabel" type="Label" parent="VBoxContainer"]
          layout_mode = 2
          text = "GYM SURVIVOR"
          horizontal_alignment = 1
          [node name="PlayButton" type="Button" parent="VBoxContainer"]
          custom_minimum_size = Vector2(0, 80)
          layout_mode = 2
          text = "JOGAR"
          EOF

          cat << 'EOF' > scripts/ui/main_menu.gd
          class_name MainMenu
          extends Control
          @onready var play_button: Button = $VBoxContainer/PlayButton
          func _ready() -> void:
          	play_button.pressed.connect(_on_play_pressed)
          func _on_play_pressed() -> void:
          	get_tree().quit()
          EOF

          # Criar o export_presets.cfg exigido pelo Godot
          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server_id=0
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/gym-survivor.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.example.gymsurvivor"
          package/name="Gym Survivor"
          package/signed=true
          EOF

      - name: Generate Debug Keystore & Setup Settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=BR" -validity 10000
          mkdir -p ~/.android
          mv debug.keystore ~/.android/debug.keystore

          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.godot
          [export/android]
          android_sdk_path = "$ANDROID_HOME"
          debug_keystore = "$HOME/.android/debug.keystore"
          debug_keystore_user = "androiddebugkey"
          debug_keystore_password = "android"
          EOF

      - name: Import Assets and Export APK
        run: |
          mkdir -p build
          godot --headless --editor --quit || true
          godot --headless --verbose --export-release "Android" build/gym-survivor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-survivor-apk
          path: build/gym-survivor.apk
