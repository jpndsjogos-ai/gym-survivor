name: Build Android APK (Gym Survivor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and Install Godot 4.2.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip Godot_v4.2.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=BR" -validity 10000
          mkdir -p ~/.android
          mv debug.keystore ~/.android/debug.keystore

      - name: Download Godot Export Templates
        run: |
          GODOT_VERSION="4.2.1.stable"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATES_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip -q Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* "$TEMPLATES_DIR/"
          rm Godot_v4.2.1-stable_export_templates.tpz

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/gym-survivor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-survivor-apk
          path: build/gym-survivor.apk
